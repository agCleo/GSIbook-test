site_name: GSIbook

site_url: https://agCleo.github.io/GSIbook-test/

theme:
  name: material
  language: en # Langue par défaut de l'interface graphique
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs # Menu horizontal en haut pour les grands écrans
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true

# Définition du menu (la vue livre)
# TRÈS IMPORTANT : Utilisez le nom générique .md (sans l'extension de langue)
# Le plugin i18n associera automatiquement le bon fichier selon la langue.
nav:
  - Accueil: index.md
  - Guide d'utilisation:
    - Premier chapitre: GSIbook-test-BASE.md
