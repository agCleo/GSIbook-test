site_name: Guide to Scholarly Indexes

site_url: https://agCleo.github.io/GSIbook-test/

theme:
  name: material
  custom_dir: overrides
  language: en # Default language for interface
  logo: assets/EDCH_IconColourPos.png
  favicon: assets/EDCH_IconColourPos.png
  palette:
    primary: indigo
    accent: deep orange
  features:
    - navigation.tabs # Horizontal menu at the top
    - search.suggest
    - search.highlight
    - navigation.top # Back to the top button

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.magiclink # Automatically transforms URLs in hyperlinks

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true

nav: # Contains file names without the language extension processed by i18n plugin
  - Home: index.md
  - Index:
    - BASE: GuideScholIndex_BASE.md
    - CEEOL: GuideScholIndex_CEEOL.md
    - CORE: GuideScholIndex_CORE.md
    - Crossref: GuideScholIndex_Crossref.md
    - Datacite: GuideScholIndex_Datacite.md
    - Dimensions: GuideScholIndex_Dimensions.md
    - DOAJ: GuideScholIndex_DOAJ.md
    - EBSCOHost: GuideScholIndex_EBSCOHost.md
  - Reference:
    - Template: GuideScholIndex_template_v4.md
    
