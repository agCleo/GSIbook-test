site_name: GSIbook

site_url: https://agCleo.github.io/GSIbook-test/

theme:
  name: material
  language: en # Langue par défaut de l'interface graphique
  logo: assets/EDCH-logo.png
  favicon: assets/EDCH-logo.png
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs # Menu horizontal en haut pour les grands écrans
    - search.suggest
    - search.highlight
    - navigation.top

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true

nav:
  - Home: index.md
  - Guide:
    - BASE: GSIbook-test-BASE.md
    - CEEOL: GSIbook-test-CEEOL.md
    - CORE: GSIbook-test-CORE.md
    - Crossref: GSIbook-test-Crossref.md
    - Datacite: GSIbook-test-Datacite.md
    
